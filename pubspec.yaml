name: mini_catalogo_produtos
description: A mini catalog of products with MVVM architecture using Provider.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  cloud_firestore: ^4.14.0
  firebase_core: ^2.24.0
  provider: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.0.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
